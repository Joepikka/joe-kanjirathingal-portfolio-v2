<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1040, height=800" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1040px; height: 800px; overflow: hidden; background: #f8f8f5; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- Three 8 s portfolio loops rendered together, then split per project with ffmpeg. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1040" data-height="800">
      <div id="intentdesk" data-composition-id="intentdesk" data-composition-src="compositions/intentdesk.html" data-start="0" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1040" data-height="800"></div>
      <div id="crimemap" data-composition-id="crimemap" data-composition-src="compositions/crimemap.html" data-start="8" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1040" data-height="800"></div>
      <div id="laliga" data-composition-id="laliga" data-composition-src="compositions/laliga.html" data-start="16" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1040" data-height="800"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
